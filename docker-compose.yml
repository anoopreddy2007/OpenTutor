services:
  postgres:
    image: postgres:16
    container_name: opentutor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: opentutor
      POSTGRES_PASSWORD: opentutor_dev
      POSTGRES_DB: opentutor

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: